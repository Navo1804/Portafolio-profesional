{% extends 'base.html' %}
{% block titulo %}Error {{ codigo }} | Mi Portafolio{% endblock %}

{% block contenido %}
<section class="about-banner">
    <div class="container">
        <span class="eyebrow">Error {{ codigo }}</span>
        <h2>Algo no salió bien</h2>
    </div>
</section>

<section class="section-ledger text-center">

        <a href="{{ url_for('main.home') }}" class="btn-pill">Volver al inicio</a>
    </div>

{% endblock %}
